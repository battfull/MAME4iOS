name: macOS Catalyst Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download macOS MAME library
        run: ./get-libmame.sh mac

      - name: Build macOS Catalyst app
        working-directory: xcode/MAME4iOS
        run: |
          xcodebuild \
            -project MAME4iOS.xcodeproj \
            -scheme "MAME4iOS Release" \
            -configuration Release \
                 -destination "platform=macOS,variant=Mac Catalyst" \
                 CODE_SIGNING_ALLOWED=NO \
                 -derivedDataPath "$GITHUB_WORKSPACE/build" \
                 build

           - name: Package macOS app
             run: |
               APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
               test -n "$APP_PATH"
               ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" MAME4iOS-macOS.zip

           - name: Upload macOS app
             uses: actions/upload-artifact@v4
             with:
               name: MAME4iOS-macOS
               path: MAME4iOS-macOS.zip
